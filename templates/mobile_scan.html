{% extends "base.html" %}
{% block content %}
<p>Take a picture of the barcode — it scans and uploads automatically.</p>

<label class="upload-btn" for="fileInput">📷 Scan Barcode</label>
<input type="file" id="fileInput" name="file" accept="image/*" capture="environment">

<div id="status"></div>
{% endblock %}

{% block scripts %}
<script>
const input = document.getElementById("fileInput");
const status = document.getElementById("status");

input.addEventListener("change", () => {
  if (!input.files.length) return;

  const data = new FormData();
  data.append("file", input.files[0]);

  status.className = "";
  status.textContent = "Scanning…";

  fetch(window.location.pathname, { method: "POST", body: data })
    .then(res => res.json().then(body => ({ ok: res.ok, body })))
    .then(({ ok, body }) => {
      if (ok && body.success) {
        status.className = "success";
        status.innerHTML = `✅ Added <strong>${body.book.title}</strong> by ${body.book.author}`;
      } else {
        status.className = "error";
        status.textContent = "😢 " + (body.error || "Something went wrong");
      }
    })
    .catch(() => {
      status.className = "error";
      status.textContent = "😢 Upload failed — check your connection";
    })
    .finally(() => {
      input.value = "";
    });
});
</script>

{% endblock %}
